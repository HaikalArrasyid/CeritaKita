services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ceritakita
      POSTGRES_PASSWORD: ceritakita
      POSTGRES_DB: ceritakita
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceritakita"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
